name: Build Thai voice models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_voices.py', '.github/workflows/build-voices.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers==4.44.2 onnx==1.16.2 onnxruntime==1.19.2 tokenizers huggingface_hub soundfile librosa numpy==1.26.4
      - name: Convert
        run: |
          python tools/build_voices.py
          python3 -c "import json;r=json.load(open('out/report.json'));[print('::notice title='+k+'::'+json.dumps({x:v.get(x) for x in ['ok','f0','gender','sec','size','tok_match','dynamic_ok','error']},ensure_ascii=False).replace(chr(10),' ')) for k,v in r.items()]"
          du -sh out; find out -size +95M -exec ls -la {} \;
      - name: Publish to models branch
        run: |
          cd out
          git init -q -b models
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Thai voice models (ONNX) for AI Voice"
          git -c http.postBuffer=524288000 push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" models > ../push.log 2>&1 || { echo "::error title=push::$(tail -c 1500 ../push.log | tr '\n' ' ')"; exit 1; }
