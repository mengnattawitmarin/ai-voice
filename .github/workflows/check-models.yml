name: Check TTS models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-models.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Hugging Face
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(url, head=False):
              req = urllib.request.Request(url, method='HEAD' if head else 'GET', headers={'User-Agent': 'ai-voice-check'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, (None if head else r.read().decode('utf-8', 'ignore'))
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  return str(e), None
          out = {}
          lists = {}
          for q in ['author=Tanotfin&search=tts', 'author=Tanotfin&search=thai', 'search=mms-tts-tha', 'search=thai%20onnx&filter=text-to-speech', 'filter=transformers.js&search=thai']:
              st, body = get('https://huggingface.co/api/models?limit=100&' + q)
              try: lists[q] = [m['id'] for m in json.loads(body)]
              except Exception: lists[q] = st
          out['lists'] = lists
          cands = set(['Xenova/mms-tts-eng', 'Tanotfin/mms-thai-jori-f5-onnx', 'Tanotfin/mms-thai-riko-f5-onnx',
                       'Tanotfin/mms-thai-female-podcast-spk0-stable2-onnx', 'Tanotfin/mms-tts-2081-M-stable-onnx',
                       'Tanotfin/mms-tts-2081-FM-stable-onnx', 'Tanotfin/mms-tts-2081-stable-onnx',
                       'Tanotfin/mms-tts-2081-M-stable2-onnx', 'Tanotfin/mms-tts-2081-FM-stable2-onnx'])
          for v in lists.values():
              if isinstance(v, list): cands.update(v)
          res = {}
          for m in sorted(cands):
              st, body = get(f'https://huggingface.co/api/models/{m}')
              info = {}
              try:
                  d = json.loads(body); info = {'sha': d.get('sha'), 'gated': d.get('gated'), 'private': d.get('private'),
                    'tags': d.get('tags'), 'files': [s['rfilename'] for s in d.get('siblings', [])], 'card': (d.get('cardData') or {})}
              except Exception: pass
              c, _ = get(f'https://huggingface.co/{m}/resolve/main/config.json', head=True)
              o, _ = get(f'https://huggingface.co/{m}/resolve/main/onnx/model.onnx', head=True)
              readme = get(f'https://huggingface.co/{m}/raw/main/README.md')[1] or ''
              res[m] = {'api': st, 'config': c, 'model_onnx': o, **info, 'readme': readme[:1500]}
          out['models'] = res
          json.dump(out, open('model-status.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add model-status.json
          git commit -m "Update model-status.json" || true
          git push
