name: mac-app
concurrency: {group: mac-app, cancel-in-progress: true}
on:
  workflow_dispatch:
    inputs:
      smoke: {description: 'install + run server smoke test', default: 'true'}
  push:
    branches: [main]
    paths: ['server/genmedi_server.py', 'server/launcher.py', 'server/requirements-mac.txt', 'mac/**', '.github/workflows/mac.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bundled Python + cloudflared
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -e
          mkdir -p dl
          python3 -m pip install -q --break-system-packages --user uv
          python3 -m uv python install 3.11 --install-dir "$PWD/dl/py"
          PYDIR=$(ls -d dl/py/cpython-3.11*aarch64* | head -1); echo "python dir: $PYDIR"; ls "$PYDIR/bin" | head
          mkdir -p dl/pyroot && cp -R "$PYDIR" dl/pyroot/python
          tar -czf dl/python.tgz -C dl/pyroot python
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz -o dl/cf.tgz
      - name: Build Gen Medi.app
        run: |
          set -e
          APP="build/Gen Medi.app"; mkdir -p build
          osacompile -s -o "$APP" mac/applet.applescript
          R="$APP/Contents/Resources"
          tar -xzf dl/python.tgz -C "$R"            # → Resources/python
          mkdir -p "$R/bin" "$R/genmedi" "$R/web"
          tar -xzf dl/cf.tgz -C "$R/bin"; chmod +x "$R/bin/cloudflared"
          cp server/launcher.py server/genmedi_server.py server/requirements-mac.txt "$R/genmedi/"
          rsync -a --exclude server --exclude mac --exclude android --exclude tools --exclude '.git*' --exclude build --exclude dl --exclude '*.md' ./ "$R/web/"
          # icon
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do sips -z $s $s icons/icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null; d=$((s*2)); [ $d -le 512 ] && sips -z $d $d icons/icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null; done
          cp icons/icon-512.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$R/applet.icns"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Gen Medi" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Gen Medi" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string io.github.mengnattawitmarin.genmedi" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier io.github.mengnattawitmarin.genmedi" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 2.0.${{ github.run_number }}" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 13.0" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string Gen Medi opens a folder picker so you can choose where to save your work." "$P" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=1 "$APP" || true
          du -sh "$APP"
      - name: Smoke test (install deps, start server, TTS)
        if: github.event_name == 'push' || inputs.smoke == 'true'
        timeout-minutes: 60
        run: |
          set -e
          R="build/Gen Medi.app/Contents/Resources"
          export GENMEDI_DATA="$PWD/smoke-data" GENMEDI_PORT=7861
          # run exactly what the app runs: bundled python + launcher (installs deps itself, then starts the server)
          (cd "$R" && ./python/bin/python3 genmedi/launcher.py > "$GITHUB_WORKSPACE/launcher.log" 2>&1 &)
          for i in $(seq 1 600); do
            if curl -sf localhost:7861/api/ping >/dev/null; then echo "server up after $((i*3))s"; break; fi
            [ $((i % 20)) = 0 ] && (curl -s localhost:7861/status | head -c 300; echo)
            sleep 3
          done
          curl -sf localhost:7861/api/ping || { echo "SERVER NOT UP"; cat launcher.log; tail -50 smoke-data/logs/*.log; exit 1; }
          curl -sf localhost:7861/ | head -c 200; echo
          curl -s localhost:7861/api/info | head -c 1500; echo
          for i in $(seq 1 90); do st=$(curl -s localhost:7861/api/info | python3 -c "import sys,json; print(json.load(sys.stdin)['models']['tts']['state'])"); echo "tts model: $st"; [ "$st" = ready ] && break; sleep 5; done
          mkdir -p out
          curl -s -X POST localhost:7861/api/tts -H 'Content-Type: application/json' -d '{"text":"สวัสดีครับ วันนี้เราจะมาเล่าเรื่องที่น่าสนใจให้ฟังกันนะครับ","speaker":"Thorsten"}' -o out/tts-thorsten.wav -w "%{http_code} %{size_download}\n"
          curl -s -X POST localhost:7861/api/tts -H 'Content-Type: application/json' -d '{"text":"สวัสดีค่ะ ยินดีต้อนรับสู่เจนเมดิ แอปทำวิดีโอของคุณ","speaker":"Linda"}' -o out/tts-linda.wav -w "%{http_code} %{size_download}\n"
          curl -s -X POST localhost:7861/api/tts -H 'Content-Type: application/json' -d '{"text":"Hello from Gen Medi","speaker":"Kerstin"}' -o out/tts-kerstin.wav -w "%{http_code} %{size_download}\n"
          curl -s -o /dev/null -w "remote no token: %{http_code}\n" -H 'Host: x.trycloudflare.com' localhost:7861/api/info
          curl -s localhost:7861/api/info | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:d[k] for k in ('tunnel','tunnel_state','speakers','tts_ms_per_char') if k in d})"
          file out/*.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smoke, path: "out\nlauncher.log\nsmoke-data/logs"}
      - name: DMG
        run: |
          set -e
          mkdir -p dmg && cp -R "build/Gen Medi.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Gen Medi" -srcfolder dmg -ov -format UDZO GenMedi-mac.dmg
          ls -lh GenMedi-mac.dmg
      - name: Publish to release "mac"
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view mac >/dev/null 2>&1 || gh release create mac --prerelease --title "Gen Medi for Mac" --notes "ดาวน์โหลด GenMedi-mac.dmg → เปิด → ลาก Gen Medi ไปที่ Applications → เปิดแอป (ครั้งแรก: ตั้งค่าระบบ › ความเป็นส่วนตัวและความปลอดภัย › เปิดต่อไป) · ต้องใช้ Mac ชิป Apple (M1 ขึ้นไป)"
          gh release upload mac GenMedi-mac.dmg --clobber
