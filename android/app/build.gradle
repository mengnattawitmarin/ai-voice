plugins { id 'com.android.application' }

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.mengnattawitmarin.aivoice'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.mengnattawitmarin.aivoice'
        minSdk 21
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release {
            // Personal sideload key (not for Play Store). Replace with a private key + GitHub Secrets before publishing.
            storeFile file('ai-voice.keystore')
            storePassword 'aivoice123'
            keyAlias 'aivoice'
            keyPassword 'aivoice123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
